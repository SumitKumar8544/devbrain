<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Brain & Neural Network Icon Path -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M24 18a6 6 0 0 0-6 6c0 1.5.5 2.8 1.4 3.9A6.5 6.5 0 0 0 16 34a6.5 6.5 0 0 0 4 6c0 2.2 1.8 4 4 4h4V18h-4z" />
    <!-- Right Hemisphere -->
    <path d="M40 18a6 6 0 0 1 6 6c0 1.5-.5 2.8-1.4 3.9A6.5 6.5 0 0 1 48 34a6.5 6.5 0 0 1-4 6c0 2.2-1.8 4-4 4h-4V18h4z" />
    <!-- Central Synapse Divider -->
    <line x1="28" y1="24" x2="36" y2="24" />
    <line x1="28" y1="32" x2="36" y2="32" />
    <line x1="28" y1="40" x2="36" y2="40" />
  </g>

  <!-- AI Sparkle Star on Top Right -->
  <path d="M48 11 L49.5 15.5 L54 17 L49.5 18.5 L48 23 L46.5 18.5 L42 17 L46.5 15.5 Z" fill="#facc15" />
</svg>